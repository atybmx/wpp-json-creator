<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Gerador de JSON com Preview</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    input, textarea { margin: 5px 0; padding: 5px; width: 400px; }
    textarea { height: 120px; }
    button { margin: 5px 0; padding: 5px 10px; }
    pre { background: #f4f4f4; padding: 10px; border: 1px solid #ccc; white-space: pre-wrap;min-height:380px;}

    /* Estilo do preview estilo WhatsApp */
    .whatsapp-preview {
      background: #e5ddd5;
      border: 1px solid #ccc;
      border-radius: 10px;
      width: 400px;
      padding: 15px;
      margin-top: 20px;
      min-height: 370px;
    }
    .bubble {
      background: #dcf8c6;
      border-radius: 10px;
      padding: 3px;
      margin: 5px 0;
      max-width: 90%;
      word-wrap: break-word;
    }
    .bubble .img {
      max-width: 100%;
      border-radius: 10px;
      margin-bottom: 10px;
    }
    .bubble p{
      padding:0 7px;
    }
    .bubble .footer {
      font-size: 12px;
      color: #555;
      margin-top: 10px;
      padding: 0 7px 5px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .bubble .button {
      display: inline-block;
      text-align: center;
      background: transparent;
      color: #0d6efd;
      padding: 6px 12px;
      margin: 5px 3px 0 0;
      border-radius: 5px;
      font-size: 14px;
      text-decoration: none;
    }
    .bubble .buttons{
      display: flex;
      flex-direction: column;
      padding-top: 5px;
      border-top: 1px solid #dcdcdc;
    }

    .alert {
      position: fixed;
      bottom: 20px;
      right: 30px;
      z-index: 1000;
      display: none;
    }
    .bold { font-weight: bold; }
    .italic { font-style: italic; }
    .strike { text-decoration: line-through; }

    #history{display: flex;flex-wrap: wrap;align-items: flex-start;}
    #history .bubble{cursor: pointer;width: 300px;margin: 10px;transition:all .3s ease;}
    #history .bubble:hover{box-shadow:0 0 10px rgba(125,125,125,.5);}
  </style>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</head>
<body>

  <div class="container-fluid">
    <div class="row">
      <div class="col-md-4">
        <h3>Monte a mensagem aqui:</h3>
        <div class="row">
          <div class="col-md-12">
            <label for="url">URL:</label>
            <input type="text" class="form-control" id="url" placeholder="Digite a URL">
          </div>

          <div class="col-md-12">
            <label for="footer">Footer:</label>
            <input type="text" class="form-control" id="footer" placeholder="Digite o Footer" value="MULTIBET">
          </div>
          
          <div class="col-md-12">
            <label for="message">Message:</label>
            <textarea id="message" class="form-control" placeholder="Digite a mensagem"></textarea>
            <div class="message-options">
              <button class="btn btn-sm btn-icon btn-secondary" onclick="applyStyle('*')"><i class="bi bi-type-bold"></i></button>
              <button class="btn btn-sm btn-icon btn-secondary" onclick="applyStyle('_')"><i class="bi bi-type-italic"></i></button>
              <button class="btn btn-sm btn-icon btn-secondary" onclick="applyStyle('~')"><i class="bi bi-type-strikethrough"></i></button>
            </div>
          </div>

          <div class="col-md-12 mt-3">
            <h3>Adicionar Botão:</h3>

            <div class="row">
              <div class="col-md-5"><input type="text" class="form-control" id="buttonText" placeholder="Texto do botão"></div>
              <div class="col-md-5"><input type="text" class="form-control" id="buttonLink" placeholder="Link do botão"></div>
              <div class="col-md-2"><button class="btn btn-primary" onclick="addButton()">Adicionar</button></div>
            </div>
          </div>
          
        </div>
      </div>
      <div class="col-md-4">
        <h3>JSON Gerado:</h3>
        <pre id="output"></pre>
        <button class="btn btn-success" onclick="copyToClipboard()"><i class="bi bi-copy"></i> Copiar JSON</button>
      </div>
      <div class="col-md-4">
        <h3>Preview WhatsApp:</h3>
        <div class="whatsapp-preview" id="preview"></div>
      </div>
    </div>
    <div class="row">
      <div class="col-md-12"><hr></div>
    </div>
    <div class="row">
      <div class="col-md-12">
        <h3>Histórico:</h3>
        <button class="btn btn-danger mt-2" onclick="clearHistory()"><i class="bi bi-trash"></i> Limpar histórico</button>

        <div id="history"></div>
      </div>
    </div>
  </div>

  <div class="alert alert-success alert-dismissible fade show" role="alert" id="copy-alert">
    <strong>JSON</strong> copiado para o clipboard!
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
  </div>

  

  <script>
    let history = [];

    const buttons = [];
    const buttonsHtml = [];

    window.onload = function() {
      const saved = localStorage.getItem("messageHistory");
      if (saved) {
        history = JSON.parse(saved);
        renderHistory();
      }
    };

    function saveToHistory(entry) {
      history.unshift(entry); // adiciona no início
      if (history.length > 20) history = history.slice(0, 20); // limita a 20 itens
      localStorage.setItem("messageHistory", JSON.stringify(history));
      renderHistory();
    }

    function renderHistory() {
      const container = document.getElementById("history");
      container.innerHTML = "";
      history.forEach((item, index) => {
        const hora = new Intl.DateTimeFormat('pt-BR', { hour: '2-digit', minute: '2-digit' }).format(new Date());
        let bubble = `<div class="bubble" onclick="loadFromHistory(${index})">
          ${item.url ? `<img src="${item.url}" class="img"/>` : '' }
          <p>${item.message.replace(/\n/g, "<br>")
            .replace(/\*(.*?)\*/g, "<span class='bold'>$1</span>")
            .replace(/_(.*?)_/g, "<span class='italic'>$1</span>")
            .replace(/~(.*?)~/g, "<span class='strike'>$1</span>")}</p>
          <div class="footer">
            ${item.footer}<span class="datetime">${hora}</span>
            <button class="btn btn-sm btn-danger" onclick="removeFromHistory(${index})"><i class="bi bi-trash"></i></button>
          </div>`;
        if (item.buttons && item.buttons.length > 0) {
          bubble += '<div class="buttons">';
          item.buttons.forEach(btn => {
            bubble += `<a href="${btn.link}" class="button"><i class="bi bi-arrow-up-right-square"></i> ${btn.text}</a>`;
          });
          bubble += '</div>';
        }
        bubble += '</div>';
        container.innerHTML += bubble;
      });
    }

    function loadFromHistory(index) {
      const item = history[index];
      if (!item) return;

      // Recarrega os campos do editor
      document.getElementById("url").value = item.url || "";
      document.getElementById("footer").value = item.footer || "MULTIBET";
      document.getElementById("message").value = item.message || "";

      // Recarrega botões
      buttons.length = 0;
      buttonsHtml.length = 0;
      if (item.buttons) {
        item.buttons.forEach(btn => {
          buttons.push(`${toUnicodeEscape(btn.text)}|${btn.link}`);
          buttonsHtml.push({ text: btn.text, link: btn.link });
        });
      }

      // Atualiza JSON e preview
      generateJSON();

      // Faz scroll para o topo
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function clearHistory() {
      history = [];
      localStorage.removeItem("messageHistory");
      renderHistory();
    }

    function removeFromHistory(index) {
      history.splice(index, 1); // remove o item
      localStorage.setItem("messageHistory", JSON.stringify(history));
      renderHistory();
    }

    function toUnicodeEscape(str) {
      return str.replace(/[\s\S]/g, function(char) {
        const code = char.charCodeAt(0);
        if (code < 128) {
          return char;
        }
        return "\\u" + ("0000" + code.toString(16)).slice(-4);
      })
      .replace(/\r?\n/g, "\\r\\n")
      .replace(/%r%n/g, "\\r\\n");
    }

    function applyStyle(symbol) {
      const textarea = document.getElementById("message");
      const start = textarea.selectionStart;
      const end = textarea.selectionEnd;
      const text = textarea.value;

      if (start !== end) {
        const selected = text.substring(start, end);
        const newText = text.substring(0, start) + symbol + selected + symbol + text.substring(end);
        textarea.value = newText;
        generateJSON();
      } else {
        alert("Selecione um trecho da mensagem para aplicar estilo.");
      }
    }

    function addButton() {
      const btnText = document.getElementById("buttonText").value.trim();
      const btnLink = document.getElementById("buttonLink").value.trim();
      if (btnText && btnLink) {
        const btnTextUnicode = toUnicodeEscape(btnText);
        buttons.push(`${btnTextUnicode}|${btnLink}`);
        buttonsHtml.push({ text: btnText, link: btnLink });
        document.getElementById("buttonText").value = "";
        document.getElementById("buttonLink").value = "";
        generateJSON();
      } else {
        alert("Preencha os dois campos: Texto e Link do botão.");
      }
    }

    function generateJSON() {
      const url = document.getElementById("url").value.trim() || "";
      const footer = document.getElementById("footer").value.trim() || "MULTIBET";
      const messageRaw = document.getElementById("message").value.trim();
      const messageUnicode = toUnicodeEscape(messageRaw) || "";

      if(!messageRaw) return;

      let jsonData = `{
        "phone": "{{state.user_phone}}",
        "type": "button",
        ${url ? `"url": "${url}",` : ''}
        "message": "${messageUnicode}",
        ${footer ? `"footer": "${footer}"` : ''}`;

            if (buttons.length > 0) {
              jsonData += `,
        "buttons": ${JSON.stringify(buttons, null, 2)}`;
            }

            jsonData += `
      }`;

      document.getElementById("output").textContent = jsonData;

      // Atualiza preview estilo WhatsApp
      const horaAtual = new Intl.DateTimeFormat('pt-BR', { hour: '2-digit', minute: '2-digit' }).format(new Date());
      let previewHTML = `
          <div class="bubble">
            ${url ? `<img src="${url}" class="img"/>` : '' }
            <p>${messageRaw
                  .replace(/\n/g, "<br>")
                  .replace(/\*(.*?)\*/g, "<span class='bold'>$1</span>")
                  .replace(/_(.*?)_/g, "<span class='italic'>$1</span>")
                  .replace(/~(.*?)~/g, "<span class='strike'>$1</span>")}</p>
            <div class="footer">${footer}<span class="datetime">${horaAtual}</span></div>`;
      if (buttonsHtml.length > 0) {  
        previewHTML += '<div class="buttons">';      
        buttonsHtml.forEach(btn => {
          previewHTML += `<a href="${btn.link}" class="button"><i class="bi bi-arrow-up-right-square"></i> ${btn.text}</a>`;
        });
        previewHTML += '</div>';
      }
      previewHTML += '</div>';
      document.getElementById("preview").innerHTML = previewHTML;
    }

    function copyToClipboard() {
      const text = document.getElementById("output").textContent;

      if (!navigator.clipboard) {
    		var $temp = $("<input>");
    	    $("body").append($temp);
    	    $temp.val(text).select();
    	    document.execCommand("copy");
    	    $temp.remove();
    	    
          $('#copy-alert').fadeIn().delay(3000).fadeOut();

          // Salva no histórico aqui
          saveToHistory({
            message: document.getElementById("message").value.trim(),
            json: JSON.parse(text),
            footer: document.getElementById("footer").value.trim(),
            url: document.getElementById("url").value.trim(),
            buttons: [...buttonsHtml]
          });

    	    return;
    	  }
    	  navigator.clipboard.writeText(text).then(function() {
    	    $('#copy-alert').fadeIn().delay(3000).fadeOut();

          // Salva no histórico aqui
          saveToHistory({
            message: document.getElementById("message").value.trim(),
            json: JSON.parse(text),
            footer: document.getElementById("footer").value.trim(),
            url: document.getElementById("url").value.trim(),
            buttons: [...buttonsHtml]
          });
    	  }, function(err) {
    	    console.error('Async: Could not copy text: ', err);
    	  });
    }

    document.querySelectorAll("#url, #footer, #message").forEach(el => {
      el.addEventListener("input", generateJSON);
    });
  </script>
</body>
</html>
